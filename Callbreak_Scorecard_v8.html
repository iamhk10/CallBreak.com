<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0d">
<title>Callbreak.com - Scorecard</title>
<style>
:root{--bg:#0a0a0d;--card:#15151b;--card2:#1e1e26;--text:#f4f4f6;--mut:#9b9ba8;--acc:#e50914;--grad:linear-gradient(135deg,#e50914,#ff4d4d);--onacc:#fff;--bd:rgba(255,255,255,.09);--good:#2ecc71;--bad:#ff5a5f;--r:18px;--solid:#15151b;--bf:none}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;font-family:Inter,"SF Pro Display",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;color:var(--text);background:var(--card)}
#bg{position:fixed;inset:0;background:var(--bg);z-index:-1}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;touch-action:manipulation}
input{font:inherit;color:inherit}
.hidden{display:none!important}
header#top{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:10px;padding:10px 14px;padding-top:calc(10px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--bd)}
.brand{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;font-weight:800;font-size:21px;letter-spacing:-.02em;white-space:nowrap}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand span{color:var(--mut);font-weight:600}
.timer{display:flex;align-items:center;gap:7px;font-variant-numeric:tabular-nums;font-weight:700;font-size:13px;padding:8px 12px;border-radius:999px;background:var(--card2);border:1px solid var(--bd);color:var(--text)}.timer svg{width:12px;height:12px;fill:currentColor;display:block}.timer.paused{color:var(--acc);border-color:var(--acc);animation:blink 1.4s ease-in-out infinite}.timer[disabled]{pointer-events:none}@keyframes blink{50%{opacity:.55}}
.icon-btn{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--card2);border:1px solid var(--bd);transition:transform .15s}
.icon-btn:active{transform:scale(.9)}
.icon-btn svg{width:22px;height:22px;stroke:var(--text);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{max-width:760px;margin:0 auto;padding:16px 14px 90px}
.view.enter{animation:vin .35s cubic-bezier(.2,.8,.2,1)}
@keyframes vin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.hero{font-size:30px;margin:6px 0 4px;letter-spacing:-.03em}
.sub{color:var(--mut);margin:0 0 16px;font-size:14px;line-height:1.45}
.card{background:var(--card);border:1px solid var(--bd);border-radius:var(--r);padding:16px;margin-bottom:12px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row.c{justify-content:center}
.btn{background:var(--grad);color:var(--onacc);font-weight:700;padding:11px 18px;border-radius:12px;transition:transform .15s,filter .2s}
.btn:active{transform:scale(.96)}
.btn.ghost{background:var(--card2);color:var(--text);border:1px solid var(--bd)}
.btn.sm{padding:8px 12px;font-size:13px}
.btn.wide{width:100%;padding:15px;font-size:16px;margin-top:6px}
.btn[disabled]{opacity:.4;pointer-events:none}
.backrow{margin-bottom:8px}
.ct{margin:0 0 10px;font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut)}
.note{color:var(--mut);font-size:12.5px;margin:8px 0 0;line-height:1.45}
.prow{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.pn{width:26px;height:26px;border-radius:50%;background:var(--card2);display:grid;place-items:center;font-size:12px;font-weight:700;color:var(--mut)}
.inp{flex:1;min-width:0;padding:12px 14px;border-radius:12px;border:1px solid var(--bd);background:var(--card2);outline:none;font-size:16px;transition:border-color .2s}
.inp:focus{border-color:var(--acc)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:9px 14px;border-radius:999px;background:var(--card2);border:1px solid var(--bd);font-weight:600;font-size:14px;transition:.15s}
.chip.on{background:var(--grad);color:var(--onacc);border-color:transparent}
.rules3{display:grid;gap:8px}
.opt{text-align:left;padding:12px 14px;border-radius:14px;background:var(--card2);border:1px solid var(--bd);display:flex;flex-direction:column;gap:2px;transition:.15s}
.opt span{font-size:12.5px;color:var(--mut)}
.opt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.minlist{margin-top:10px;display:grid;gap:8px}
.mrow{display:flex;align-items:center;justify-content:space-between;background:var(--card2);border-radius:12px;padding:8px 12px}
.mini{display:flex;align-items:center;gap:12px}
.mini button{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--bd);font-size:18px;font-weight:700}
.mini b{min-width:24px;text-align:center;font-size:18px}
.lbl{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--mut);margin-bottom:2px}
.rhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.rno{font-size:28px;font-weight:800;letter-spacing:-.03em}
.rno small{font-size:15px;color:var(--mut);font-weight:600}
.dots{display:flex;gap:6px;margin-top:6px}
.dots i{width:22px;height:5px;border-radius:3px;background:var(--card2)}
.dots i.d{background:var(--grad)}
.dots i.a{background:var(--acc);opacity:.55}
.pills{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.rulepill{font-size:12px;font-weight:700;padding:6px 11px;border-radius:999px;background:var(--card2);border:1px solid var(--bd);white-space:nowrap}
.dl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.dl b{font-size:17px}
.arrow{color:var(--acc);font-size:22px;font-weight:800}
.score{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.sc{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:10px 6px;text-align:center;min-width:0}
.sc span{display:block;font-size:12px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sc b{font-size:19px;font-variant-numeric:tabular-nums}
.sc.lead{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.sc.lead span::before{content:"\265B ";color:var(--acc)}
.ptitle{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;gap:8px}
.ptitle span{font-size:13px;color:var(--mut);font-weight:600;text-align:right}
.ptitle span.ok,.ok{color:var(--good)!important}
.bad{color:var(--bad)!important}
.trump{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tb{padding:10px 0 8px;border-radius:14px;background:var(--card2);border:2px solid var(--bd);font-size:32px;line-height:1;transition:.15s}
.tb small{display:block;font-size:11px;color:var(--mut);margin-top:5px;font-weight:600}
.tb.red{color:#ee4558}
.tb.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset;transform:translateY(-2px)}
.tb:active{transform:scale(.94)}
.red{color:#ee4558}
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pc{background:var(--card2);border:1px solid var(--bd);border-radius:16px;padding:12px 8px;text-align:center;min-width:0}
.pc.dealer{border-color:var(--acc)}
.pn2{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn2 em{font-style:normal;font-size:10px;margin-left:6px;padding:2px 6px;border-radius:6px;background:var(--grad);color:var(--onacc)}
.minl{font-size:11px;color:var(--mut);margin:2px 0}
.bidchip{font-size:12px;color:var(--mut);margin:2px 0}
.bidchip b{font-size:28px;color:var(--text);margin-left:4px;font-variant-numeric:tabular-nums}
.stp{display:flex;align-items:center;justify-content:space-between;gap:4px;margin-top:6px}.stp .big{min-width:0;flex:1}
.stp button{width:38px;height:38px;flex:none;border-radius:12px;background:var(--card);border:1px solid var(--bd);font-size:22px;font-weight:700;transition:transform .12s}
.stp button:active{transform:scale(.88)}
.big{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em;min-width:56px;text-align:center}
.bump{animation:bump .22s ease}
@keyframes bump{50%{transform:scale(1.25)}}
.proj{font-size:12px;color:var(--mut);margin-top:8px}
.proj b{font-size:14px}
.acts{display:flex;gap:10px;margin:14px 0}
.acts .btn{flex:1}
.tw{overflow-x:auto;border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 3px;text-align:center;border-bottom:1px solid var(--bd)}
th{color:var(--mut);font-weight:600;font-size:12px;white-space:nowrap}
td.r{color:var(--mut);font-weight:700;white-space:nowrap}
td.r i{font-style:normal;font-size:16px;margin-left:3px}
.cbid{font-size:24px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.csub{font-size:11px;color:var(--mut);margin-top:2px;white-space:nowrap}
.pos{color:var(--good)}.neg{color:var(--bad)}
tfoot td{font-weight:800;font-size:15px;border-bottom:0}
.go{text-align:center}
.go h2{margin:4px 0}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .25s;z-index:40}
#drawer{position:fixed;top:0;bottom:0;left:0;width:min(300px,84vw);background:var(--card);border-right:1px solid var(--bd);z-index:50;transform:translateX(-102%);transition:transform .28s cubic-bezier(.2,.8,.2,1);padding:calc(20px + env(safe-area-inset-top)) 14px 20px;display:flex;flex-direction:column;gap:6px}
body.menu #drawer{transform:none}
body.menu #scrim{opacity:1;pointer-events:auto}
#drawer .dh{margin-bottom:12px}
#drawer .dh p{margin:4px 0 0;color:var(--mut);font-size:13px}
#drawer button{text-align:left;padding:13px 14px;border-radius:12px;font-weight:600;font-size:15px;background:var(--card2);border:1px solid var(--bd)}
#drawer button:active{transform:scale(.97)}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
.modal.on{opacity:1;pointer-events:auto}
.sheet{width:100%;max-width:640px;max-height:88vh;overflow:auto;background:var(--card);border:1px solid var(--bd);border-radius:22px 22px 0 0;padding:18px 18px 28px;transform:translateY(30px);transition:transform .25s cubic-bezier(.2,.8,.2,1)}
.modal.on .sheet{transform:none}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
.sh{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.sh h2{margin:0;font-size:22px;letter-spacing:-.02em}
.sheet p,.sheet li{font-size:14px;line-height:1.55;color:var(--text)}
.sheet ul{padding-left:20px;margin:6px 0}
.sheet details{background:var(--card2);border:1px solid var(--bd);border-radius:14px;padding:10px 14px;margin-bottom:8px}
.sheet summary{font-weight:700;cursor:pointer}
.sheet .mut{color:var(--mut)}
.ex{width:100%;margin:8px 0;font-size:13px}
.ex td,.ex th{padding:6px;border-bottom:1px solid var(--bd)}
.themes{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.tm{border-radius:14px;border:2px solid var(--bd);overflow:hidden;text-align:left;background:var(--card2);transition:transform .15s}
.tm:active{transform:scale(.96)}
.tm.on{border-color:var(--acc)}
.tm .pv{height:54px;display:flex;align-items:flex-end;padding:6px}
.tm .pv i{display:block;height:12px;width:60%;border-radius:6px}
.tm span{display:block;padding:7px 9px;font-size:13px;font-weight:700}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:var(--card2);border:1px solid var(--bd);padding:11px 16px;border-radius:12px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:90;max-width:90vw;text-align:center}
#toast.on{opacity:1;transform:translate(-50%,0)}
#toast.err{border-color:var(--bad)}
#win{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.78);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;transition:opacity .3s;overflow:hidden}
#win.on{opacity:1}
.winbox{width:100%;max-width:400px;background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:14px 18px 20px;text-align:center;max-height:94vh;overflow:auto}
.stage{height:215px;overflow:hidden;position:relative}
.wt{font-size:13px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);font-weight:700}
.wn{font-size:30px;font-weight:800;letter-spacing:-.03em;margin:2px 0 10px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.wl{list-style:none;padding:0;margin:0 0 14px;text-align:left}
.wl li{display:flex;justify-content:space-between;padding:8px 12px;border-radius:10px;background:var(--card2);margin-bottom:6px;font-size:14px}
.cf{position:absolute;top:-16px;width:8px;height:14px;border-radius:2px;animation:fall 2.8s linear forwards;z-index:101;pointer-events:none}
@keyframes fall{to{transform:translate(var(--dx),110vh) rotate(720deg);opacity:.9}}
.walker{display:block;margin:0 auto;animation:walkin 2.5s cubic-bezier(.3,.7,.4,1) forwards}
@keyframes walkin{from{transform:translateX(calc(-50vw - 120px))}to{transform:none}}
.walker .leg line{stroke:#2a2f4d;stroke-width:12;stroke-linecap:round}
.walker .leg ellipse{fill:#111}
.walker .arm line{stroke:var(--acc);stroke-width:11;stroke-linecap:round}
.walker .arm circle{fill:#f5c9a0}
.walker .torso{fill:var(--acc)}
.walker .head{fill:#f5c9a0}
.walker .eye{fill:#222}
.walker .smile{fill:none;stroke:#222;stroke-width:3;stroke-linecap:round}
.walker .sign rect{fill:var(--acc);stroke:#fff;stroke-width:2.5}
.walker .sign text{fill:var(--onacc);font:800 19px system-ui,sans-serif;letter-spacing:.5px}
.walker .fig{animation:bob .36s ease-in-out infinite alternate}
.walker .leg.l{transform-origin:50px 140px;animation:swL .36s ease-in-out infinite alternate}
.walker .leg.r{transform-origin:70px 140px;animation:swR .36s ease-in-out infinite alternate}
.walker .arm.l{transform-origin:40px 98px;animation:swR .36s ease-in-out infinite alternate}
.walker .arm.r{transform-origin:80px 98px;animation:swL .36s ease-in-out infinite alternate}
@keyframes swL{from{transform:rotate(26deg)}to{transform:rotate(-26deg)}}
@keyframes swR{from{transform:rotate(-26deg)}to{transform:rotate(26deg)}}
@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-5px)}}
@keyframes hop{from{transform:translateY(0)}to{transform:translateY(-14px)}}
.arrived .walker .fig{animation:hop .5s ease-in-out infinite alternate}
.arrived .walker .leg,.arrived .walker .arm{animation:none}
.arrived .walker .arm.l{transform:rotate(150deg);transition:transform .3s}
.arrived .walker .arm.r{transform:rotate(-150deg);transition:transform .3s}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}

/* ---- v7: themes, pause, drawer themes ---- */
header#top,#drawer,.sheet,.winbox,#toast{background:var(--solid)}
header#top,#drawer,.sheet,.winbox,.card,.sc{-webkit-backdrop-filter:var(--bf);backdrop-filter:var(--bf)}
#drawer{overflow-y:auto}
#drawer>*{flex:none}
#bg{overflow:hidden}
#bg i{display:none;position:absolute;pointer-events:none}
.pausebar{display:flex;align-items:center;justify-content:space-between;gap:12px;border-color:var(--acc)}
.pausebar b{font-size:17px}
.lock{opacity:.4;pointer-events:none;filter:grayscale(.4);user-select:none}
.dsec{margin:14px 2px 2px;font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:700}
#drawer button.dt{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14px}
.dt i{width:26px;height:26px;border-radius:8px;flex:none;border:1px solid var(--bd)}
#drawer button.dt.on{border-color:var(--acc);box-shadow:0 0 0 1px var(--acc) inset}
.tsec{margin:14px 0 8px;font-size:12px;text-transform:uppercase;letter-spacing:.1em;color:var(--mut);font-weight:700}
/* Orbital Ripple */
body[data-fx="orbital"] #bg .rp,body[data-fx="orbital"] #bg .o1,body[data-fx="orbital"] #bg .o2{display:block}
.rp{left:50%;top:30%;width:110vmax;height:110vmax;margin:-55vmax 0 0 -55vmax;border-radius:50%;border:3px solid rgba(76,201,240,.55);box-shadow:0 0 40px rgba(76,201,240,.25),inset 0 0 40px rgba(123,97,255,.18);transform:scale(.02);opacity:0;animation:rip 12s cubic-bezier(.25,.5,.4,1) infinite;will-change:transform,opacity}
.rp.r2{animation-delay:3s}.rp.r3{animation-delay:6s}.rp.r4{animation-delay:9s}
@keyframes rip{0%{transform:scale(.02);opacity:0}10%{opacity:.85}100%{transform:scale(1);opacity:0}}
.o1{left:50%;top:30%;width:110px;height:110px;margin:-55px 0 0 -55px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.95) 0,rgba(110,210,255,.65) 28%,rgba(123,97,255,.25) 55%,transparent 72%);animation:pulse 5s ease-in-out infinite alternate}
@keyframes pulse{from{transform:scale(.9)}to{transform:scale(1.15)}}
.o2{left:50%;top:30%;width:300px;height:300px;margin:-150px 0 0 -150px;border-radius:50%;border:1px dashed rgba(120,200,255,.4);animation:spin 26s linear infinite}
.o2::after{content:"";position:absolute;left:50%;top:-6px;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:#9be7ff;box-shadow:0 0 14px 4px rgba(120,220,255,.8)}
@keyframes spin{to{transform:rotate(360deg)}}
/* Glowing Fluid */
body[data-fx="fluid"] #bg .f1,body[data-fx="fluid"] #bg .f2,body[data-fx="fluid"] #bg .f3{display:block}
.f1,.f2,.f3{width:80vmax;height:80vmax;border-radius:50%;will-change:transform}
.f1{left:-25vmax;top:-20vmax;background:radial-gradient(circle,rgba(255,45,149,.62),rgba(255,45,149,0) 66%);animation:fa 16s ease-in-out infinite alternate}
.f2{right:-30vmax;top:10vh;background:radial-gradient(circle,rgba(0,224,255,.5),rgba(0,224,255,0) 66%);animation:fb 20s ease-in-out infinite alternate}
.f3{left:5vw;bottom:-35vmax;background:radial-gradient(circle,rgba(124,77,255,.6),rgba(124,77,255,0) 66%);animation:fc 24s ease-in-out infinite alternate}
@keyframes fa{from{transform:translate(0,0) scale(1)}to{transform:translate(35vmax,28vmax) scale(1.25)}}
@keyframes fb{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-40vmax,22vmax) scale(.85)}}
@keyframes fc{from{transform:translate(0,0) scale(1)}to{transform:translate(30vmax,-30vmax) scale(1.3)}}
/* Nebula Noir */
body[data-fx="nebula"] #bg .st,body[data-fx="nebula"] #bg .st2{display:block}
.st,.st2{inset:0;background-size:240px 240px}
.st{background-image:radial-gradient(1px 1px at 20px 30px,#fff,transparent),radial-gradient(1px 1px at 90px 120px,#dfe6ff,transparent),radial-gradient(1.5px 1.5px at 160px 60px,#fff,transparent),radial-gradient(1px 1px at 210px 180px,#ffd9f0,transparent),radial-gradient(1px 1px at 60px 200px,#fff,transparent);animation:tw 5s ease-in-out infinite alternate}
.st2{background-image:radial-gradient(1.5px 1.5px at 130px 20px,#fff,transparent),radial-gradient(1px 1px at 40px 100px,#cfd8ff,transparent),radial-gradient(1px 1px at 190px 140px,#fff,transparent),radial-gradient(1.5px 1.5px at 100px 220px,#ffd0e8,transparent);background-size:300px 300px;animation:tw 7s ease-in-out -3s infinite alternate}
@keyframes tw{from{opacity:.35}to{opacity:1}}
/* MiGlassZ and ELITEBOOK surfaces */
body[data-fx="glass"] .card,body[data-fx="glass"] .sc{box-shadow:inset 0 1px 0 rgba(255,255,255,.4),0 10px 32px rgba(8,4,36,.28)}
body[data-fx="elite"] .card,body[data-fx="elite"] .sc{box-shadow:inset 0 1px 0 rgba(255,255,255,.85),0 6px 18px rgba(20,30,50,.12)}
@media(prefers-reduced-motion:reduce){#bg i{animation:none!important}.rp{opacity:.25;transform:scale(.4)}}
/* ---- v8: 2-5 players ---- */
.pgrid>.pc:last-child:nth-child(odd){grid-column:1/-1}
.autob{margin-top:8px;width:100%}
.score.s5 .sc{padding:8px 2px}.score.s5 .sc b{font-size:16px}.score.s5 .sc span{font-size:11px}
table.n5 th{font-size:11px}table.n5 .cbid{font-size:19px}table.n5 .csub{font-size:10px}table.n5 .csub span{display:block}table.n5 .csub .dot{display:none}
table.n2 .cbid,table.n3 .cbid{font-size:26px}
</style>
</head>
<body>
<div id="bg"><i class="rp r1"></i><i class="rp r2"></i><i class="rp r3"></i><i class="rp r4"></i><i class="o1"></i><i class="o2"></i><i class="f1"></i><i class="f2"></i><i class="f3"></i><i class="st"></i><i class="st2"></i></div>
<header id="top">

/* ---------- helpers ---------- */
function elapsed(g){return g.acc+(g.run?Date.now()-g.t0:0)}

}
function resume(g){if(g&&!g.done&&!g.paused&&!g.run){g.run=true;g.t0=Date.now()}}

/* ---------- themes ---------- */
function applyTheme(id){

  var r=document.documentElement.style;
  r.setProperty('--bg',t.bg);r.setProperty('--card',t.card);r.setProperty('--card2',t.card2);r.setProperty('--text',t.text);r.setProperty('--mut',t.mut);r.setProperty('--acc',t.acc);r.setProperty('--grad',t.grad);r.setProperty('--onacc',t.onacc);r.setProperty('--bd',t.bd);
  r.setProperty('--solid',t.solid||t.card);r.setProperty('--bf',t.bf||'none');
  document.body.setAttribute('data-fx',t.fx||'');
  r.colorScheme=t.s;
  var m=document.querySelector('meta[name=theme-color]');if(m)m.setAttribute('content',t.meta||t.card);
  S.theme=t.id;
}

function aboutHtml(){return '<p><b>Callbreak.com</b> is a free digital scorecard for the card game Callbreak.</p><ul><li>Bids, tricks won, a total that can never go over the limit, and Auto fill for the last player</li><li>Trump suit marking for every round</li><li>2, 3, 4 or 5 players, with the right number of tricks for each</li><li>Normal or Queen Minus game type</li><li>Dealer and cutter shown every round</li><li>Minimum bid rules (1, 2 or free choice)</li><li>Undo that brings back bids and results so you can edit them</li><li>Game timer with pause and resume; an unfinished game is saved on this device</li><li>Winner celebration with sound, and a JPG of the final result to download or share</li><li>19 colour themes, including 5 special ones (see Themes in the menu)</li><li>Works offline. No sign-up, no ads, no tracking</li></ul><p class="mut">Your scores are saved only on this device.</p>'}
function devHtml(){return '<p><b>Callbreak.com</b> &middot; Version 8</p><p>Built with plain HTML, CSS and JavaScript in a single file. No libraries, no servers, no network calls: it runs fully in your browser and keeps data on your device.</p><ul><li>Smooth, lightweight rendering for a lag-free experience</li><li>Responsive layout for phones, tablets and desktops</li><li>Saved locally using browser storage</li></ul>'}
function rulesHtml(){
  return '<details open><summary>Basics</summary><ul>'+
  '<li><b>Players and cards:</b> 2 to 5 players, chosen when the game starts, with a standard 52-card deck. 2 players: 26 cards each. 3 players: 17 cards each, 1 extra card set aside. 4 players: 13 cards each. 5 players: 10 cards each, 2 extra cards removed.</li>'+
  '<li><b>Dealer:</b> The player who shuffles is the dealer. The player on the dealer\'s right cuts the cards and becomes the next dealer. This repeats every round. In this app, list players in seating order; the next name in the list is the player on the dealer\'s right.</li>'+
  '<li><b>Trump:</b> The trump suit is decided every round after the cards are shuffled and cut. Mark it in the <b>Trump suit</b> section before locking the bids.</li>'+
  '<li><b>Bidding:</b> After seeing their cards, every player bids how many tricks (hands) they expect to win.</li>'+
  '<li><b>Tricks:</b> The tricks won by all players must add up to the cards each player holds: 26 (2 players), 17 (3), 13 (4) or 10 (5). While entering what each player made, the app never lets the total go above this. The last player has an Auto fill button that puts in whatever is left.</li></ul></details>'+
  '<details open><summary>Scoring</summary><ul>'+
  '<li>Made exactly your bid: <b>bid &times; 10</b> points.</li>'+
  '<li>One extra trick: <b>(bid &times; 10) + 1</b>. Two extra tricks: <b>(bid &times; 10) + 2</b>.</li>'+
  '<li>More than two extra tricks, or fewer tricks than your bid: <b>&minus;(bid &times; 10)</b>.</li></ul>'+
  '<table class="ex"><thead><tr><th>Bid 5, tricks won</th><th>Points</th></tr></thead><tbody><tr><td>5</td><td>50</td></tr><tr><td>6</td><td>51</td></tr><tr><td>7</td><td>52</td></tr><tr><td>8 or more</td><td>-50</td></tr><tr><td>4 or fewer</td><td>-50</td></tr></tbody></table>'+
  '<p class="mut">A bid of 0 (free choice only) scores 0 plus 1 or 2 for one or two tricks won, and 0 otherwise.</p></details>'+
  '<details open><summary>Game type (chosen at the start)</summary><ul>'+
  '<li><b>Normal:</b> scoring exactly as above.</li>'+
  '<li><b>Queen Minus:</b> Whoever gets the Queen of the trump suit in that round gets a fine of <b>&minus;13</b> points added to their points for that round. Mark who got the Queen in the result step before saving the round. With 3 or 5 players the Queen of trump may be among the cards left out; then choose Nobody and no fine is applied.</li></ul></details>'+
  '<details><summary>Minimum bid rule (chosen at the start)</summary><ul><li><b>At least 1</b> &ndash; every player must bid 1 or more.</li><li><b>At least 2</b> &ndash; every player must bid 2 or more.</li><li><b>Free choice</b> &ndash; each player gets their own minimum, any value from 0 to 13.</li></ul><p>In every round the bid box opens at that minimum and cannot go below it.</p></details>'+
  '<details><summary>Winner and undo</summary><ul><li>After the chosen number of rounds, the highest total wins. Ties are shared.</li><li><b>Undo</b> steps back: results go back to bids, and a saved round reopens with its bids, results, trump and Queen so you can edit them.</li><li><b>Pause and resume:</b> tap the timer at the top to pause or resume. A paused game is locked and the timer stops. The game is saved on this device, so if you close the page you can come back, press Resume and continue from the same round.</li><li><b>Result image:</b> when the game ends, tap Download JPG to save the final result and share it.</li></ul></details>';
}

  else if(c.rounds.length){reopen();toast('Round '+(c.rounds.length+1)+' reopened. Edit results (or Undo again for bids).')}

  if(sum!==TT(c)){toast('Tricks must add up to '+TT(c)+' (now '+sum+')',1);return}
  if(c.mode==='q'&&c.queen==null){toast('Select who got the Queen of trump',1);return}
  c.rounds.push({trump:c.trump,queen:c.mode==='q'?c.queen:null,bids:c.bids.slice(),tricks:c.tricks.slice(),sc:cbScores(c)});

  y+=rows*78;
  rr(x,P,y+6,W-2*P,72,22);x.fillStyle=t.card2;x.fill();
  x.textAlign='left';x.fillStyle=t.mut;x.font='800 24px '+FONT;x.fillText('TOTAL',P+22,y+52);
  x.textAlign='center';
  tot.forEach(function(v,i){x.font='800 40px '+FONT;x.fillStyle=v===max?t.acc:t.text;x.fillText(String(v),P+LW+CW*i+CW/2,y+56)});
  y+=84;
  x.fillStyle=t.mut;x.font='600 22px '+FONT;x.fillText('Callbreak.com',W/2,y+44);
  return cv;
}
function resultBlob(cb){try{buildCanvas().toBlob(function(b){cb(b)},'image/jpeg',.92)}catch(e){cb(null)}}
function resName(){var d=new Date(),p=function(n){return n<10?'0'+n:''+n};return 'Callbreak_Result_'+d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+'.jpg'}
function saveJpg(){
  if(!S.cb||!S.cb.done)return;
  resultBlob(function(b){
    if(!b){toast('Could not create the image',1);return}
    var u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=resName();a.style.display='none';document.body.appendChild(a);a.click();
    setTimeout(function(){a.remove();URL.revokeObjectURL(u)},4000);toast('Downloading result image');
  });
}
function shareJpg(){
  if(!S.cb||!S.cb.done)return;
  resultBlob(function(b){
    if(!b){toast('Could not create the image',1);return}
    try{var f=new File([b],resName(),{type:'image/jpeg'});
      if(CAN_SHARE&&navigator.canShare({files:[f]})){navigator.share({files:[f],title:'Callbreak result'}).catch(function(){});return}}catch(e){}
    saveJpg();
  });
}

/* ---------- actions ---------- */
function act(a,d){
  var u=S.su,c=S.cb,i;
  switch(a){
    case 'back':showGame();break;
    case 'new':openSetup();break;
    case 'su':{var f=d.f,v=d.v;if(f==='n'){setPlayers(+v);break}if(f==='rule')u.rule=v==='free'?'free':+v;else if(f==='mode')u.mode=v;else u[f]=+v;render(false);break}
    case 'sumin':u.mins[+d.i]=clamp(u.mins[+d.i]+ +d.d,0,CARDS[u.n]);render(false);break;
    case 'start':startGame();break;
    case 'trump':c.trump=+d.v;buzz();render(false);break;
    case 'bid':i=+d.i;c.bids[i]=clamp(c.bids[i]+ +d.d,c.mins[i],TT(c));bumpId='n'+i;buzz();render(false);break;
    case 'trk':{i=+d.i;var T1=TT(c),oth1=c.tricks.reduce(function(a,b){return a+b},0)-c.tricks[i],nv=c.tricks[i]+ +d.d;
      if(nv>T1-oth1){toast('Total tricks cannot be more than '+T1,1);break}
      c.tricks[i]=Math.max(0,nv);bumpId='n'+i;buzz();render(false);break}
    case 'auto':{var T2=TT(c),n2=c.names.length-1,oth2=c.tricks.reduce(function(a,b){return a+b},0)-c.tricks[n2];c.tricks[n2]=clamp(T2-oth2,0,T2);bumpId='n'+n2;buzz();render(false);toast('Last player auto-filled: '+c.tricks[n2]);break}
    case 'queen':c.queen=c.queen===+d.i?null:+d.i;buzz();render(false);break;
    case 'lock':if(c.trump==null){toast('Mark the trump suit first',1);break}c.phase='res';c.tricks=c.names.map(function(){return 0});c.queen=null;render(false);break;
    case 'save':cbSave();break;
    case 'undo':cbUndo();break;
    case 'showwin':cbWin();break;
    case 'resume':togglePause();break;
    case 'jpg':saveJpg();break;
    case 'share':shareJpg();break;
  }
}
app.addEventListener('click',function(e){var b=e.target.closest('[data-act]');if(!b||!app.contains(b))return;act(b.dataset.act,b.dataset)});
app.addEventListener('input',function(e){
  var t=e.target;if(!t.dataset||t.dataset.bind!=='name')return;
  var i=+t.dataset.i;
  S.su.names[i]=t.value;
  var lab=t.value.trim()||('Player '+(i+1)),dl=document.getElementById('dl'+i),mn=document.getElementById('mn'+i);
  if(dl)dl.textContent=lab;if(mn)mn.textContent=lab;
});

/* ---------- chrome events ---------- */
$('#menuBtn').addEventListener('click',function(){document.body.classList.contains('menu')?closeDrawer():openDrawer()});
$('#scrim').addEventListener('click',closeDrawer);
$('#themeBtn').addEventListener('click',function(){closeDrawer();themeModal()});
$('#timer').addEventListener('click',togglePause);
document.addEventListener('click',function(e){
  var m=e.target.closest('[data-m]');
  if(m){var a=m.dataset.m;closeDrawer();
    if(a==='game')showGame();
    else if(a==='new')openSetup();
    else if(a==='about')openModal('About',aboutHtml());
    else if(a==='rules')openModal('Game Rules',rulesHtml());
    else if(a==='dev')openModal('Developer',devHtml());
    else if(a==='sound'){S.sound=!S.sound;render(false);toast('Sound '+(S.sound?'on':'off'))}
    else if(a==='close')closeModal();
    return;}
  var dt=e.target.closest('[data-dth]');
  if(dt){var v=dt.dataset.dth;if(v==='all'){closeDrawer();themeModal()}else{applyTheme(v);save();drawerThemes()}return}
  var th=e.target.closest('[data-th]');
  if(th){applyTheme(th.dataset.th);save();document.querySelectorAll('[data-th]').forEach(function(b){b.classList.toggle('on',b.dataset.th===S.theme)});drawerThemes();return}
  if(e.target.id==='modal')closeModal();
});
document.addEventListener('keydown',function(e){if(e.key==='Escape'){closeModal();closeDrawer();closeWin()}});

applyTheme(S.theme);
drawerThemes();
if(S.view==='cb'&&S.cb)resume(S.cb);
render();
wake();
})();
</script>
